<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FTC Safety Locker - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-image:
                linear-gradient(
                    rgba(0, 40, 80, 0.45),
                    rgba(0, 20, 50, 0.55)
                ),
                url("images.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);

            width: 350px;
            max-width: 100%;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        h2 {
            text-align: center;

            color: #004080;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 5px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #004080;

            box-shadow:
                0 0 5px rgba(0, 64, 128, 0.25);
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 20px;

            background: #004080;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;
        }

        button:hover {
            background: #0059b3;
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;

            text-align: center;

            font-weight: bold;

            line-height: 1.5;
        }

    </style>

</head>


<body>


    <div class="login-box">

        <h2>FTC Safety Locker</h2>


        <form id="loginForm">


            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter email address"
                autocomplete="email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>


            <div id="message"></div>


        </form>

    </div>



    <!-- =========================================
         SUPABASE JAVASCRIPT LIBRARY
         ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        /* =========================================
           SUPABASE CONNECTION
           ========================================= */

        const SUPABASE_URL =
            "https://fwrxcovfsfnrvucoscab.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_Ne7SPUCV7Vnzxn74zlUTNw_x7sobJJ8";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );



        /* =========================================
           HARD-CODED PASSWORD
           ========================================= */

        const DEMO_PASSWORD = "Ftc@2026";



        /* =========================================
           LOGIN FORM
           ========================================= */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    /* ---------------------------------
                       GET USER INPUT
                       --------------------------------- */

                    const emailInput =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const message =
                        document
                            .getElementById("message");


                    const loginButton =
                        document
                            .getElementById("loginButton");



                    /* ---------------------------------
                       NORMALIZE EMAIL

                       Email comparison is
                       case-insensitive.
                       --------------------------------- */

                    const email =
                        emailInput.toLowerCase();



                    /* ---------------------------------
                       SHOW LOADING
                       --------------------------------- */

                    message.style.color = "#004080";

                    message.textContent =
                        "Checking account...";

                    loginButton.disabled = true;



                    try {


                        /* =================================
                           CHECK EMAIL IN PROFILES TABLE

                           ilike() performs a
                           case-insensitive match.

                           Example:

                           QWER@GMAIL.COM
                           qwer@gmail.com
                           Qwer@Gmail.Com

                           will all match:

                           qwer@gmail.com
                           ================================= */

                        const {
                            data,
                            error
                        } = await supabaseClient

                            .from("profiles")

                            .select("id, email")

                            .ilike("email", email)

                            .limit(1);



                        /* ---------------------------------
                           DATABASE ERROR
                           --------------------------------- */

                        if (error) {

                            console.error(
                                "Supabase error:",
                                error
                            );

                            message.style.color =
                                "#cc0000";

                            message.textContent =
                                "Unable to check account. Please try again.";

                            loginButton.disabled = false;

                            return;
                        }



                        /* ---------------------------------
                           EMAIL NOT FOUND
                           --------------------------------- */

                        if (
                            !data ||
                            data.length === 0
                        ) {

                            message.style.color =
                                "#cc0000";

                            message.textContent =
                                "Not a registered user.";

                            loginButton.disabled = false;

                            return;
                        }



                        /* ---------------------------------
                           EMAIL FOUND

                           NOW CHECK PASSWORD
                           --------------------------------- */

                        if (
                            password !== DEMO_PASSWORD
                        ) {

                            message.style.color =
                                "#cc0000";

                            message.textContent =
                                "Incorrect password.";

                            loginButton.disabled = false;

                            return;
                        }



                        /* =================================
                           LOGIN SUCCESSFUL
                           ================================= */

                        const profile =
                            data[0];


                        /* ---------------------------------
                           SAVE LOGIN INFORMATION
                           --------------------------------- */

                        sessionStorage.setItem(
                            "lockerEmail",
                            profile.email
                        );


                        sessionStorage.setItem(
                            "lockerProfileId",
                            profile.id
                        );



                        /* ---------------------------------
                           SUCCESS MESSAGE
                           --------------------------------- */

                        message.style.color =
                            "#008000";

                        message.textContent =
                            "Login successful. Opening locker...";


                        /* ---------------------------------
                           REDIRECT
                           --------------------------------- */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "dashboard.html";

                            },
                            500
                        );


                    }


                    /* =====================================
                       UNEXPECTED ERROR
                       ===================================== */

                    catch (error) {

                        console.error(
                            "Login error:",
                            error
                        );


                        message.style.color =
                            "#cc0000";


                        message.textContent =
                            "Unable to check account. Please try again.";


                        loginButton.disabled = false;

                    }

                }
            );

    </script>


</body>

</html>
